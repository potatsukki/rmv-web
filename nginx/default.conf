server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must be revalidated on every visit so a new deploy (new hashed
  # JS/CSS file names) shows up right away instead of an old cached page.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /favicon.ico {
    try_files /RMV_Logo_Tab.png =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
